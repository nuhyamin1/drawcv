<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Figma component symbol -->
    <symbol id="icon-gem" viewBox="0 0 40 40">
      <path d="M 20 5 L 35 15 L 28 35 L 12 35 L 5 15 Z" fill="#9b59b6"/>
      <polygon points="20,14 26,20 20,26 14,20" fill="#f1c40f"/>
    </symbol>
    <clipPath id="frame-clip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>

  <rect width="240" height="180" fill="#ecf0f1"/>

  <!-- Instantiated symbol via use with transform and sizing -->
  <g opacity="0.9">
    <use href="#icon-gem" x="20" y="20" width="60" height="60"/>
  </g>

  <!-- Reused symbol with uniform scale and translation -->
  <use href="#icon-gem" transform="translate(120, 20) scale(1.5)" width="40" height="40"/>

  <!-- Clipped group with symbol -->
  <g transform="translate(60, 90)" clip-path="url(#frame-clip)">
    <rect width="100" height="100" fill="#34495e"/>
    <use href="#icon-gem" x="25" y="25" width="50" height="50"/>
  </g>
</svg>
