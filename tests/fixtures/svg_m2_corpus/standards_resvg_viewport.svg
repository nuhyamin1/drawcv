<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background canvas -->
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Nested svg viewport with viewBox meet aspect ratio and default hidden overflow -->
  <svg x="20" y="20" width="70" height="70" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
    <rect width="100" height="100" fill="#e67e22"/>
    <path d="M 10 50 A 40 40 0 1 1 90 50 A 40 40 0 1 1 10 50 Z" fill="#2c3e50"/>
    <!-- Element overflowing nested viewport boundary (must be clipped) -->
    <rect x="80" y="80" width="50" height="50" fill="#e74c3c"/>
  </svg>

  <!-- Second nested svg with explicit overflow visible -->
  <svg x="110" y="20" width="70" height="70" viewBox="0 0 100 100" overflow="visible">
    <rect width="100" height="100" fill="#1abc9c"/>
    <path d="M 20 50 A 30 30 0 1 1 80 50 A 30 30 0 1 1 20 50 Z" fill="#16a085"/>
  </svg>

  <!-- Nested svg with slice aspect ratio -->
  <svg x="50" y="110" width="100" height="70" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice">
    <rect width="60" height="60" fill="#3498db"/>
    <path d="M 10 30 A 20 20 0 0 1 50 30 Z" fill="#f39c12"/>
  </svg>
</svg>
